<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit User - CRUD Dashboard</title>
    <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,400,600,700" rel="stylesheet" />
    <script src="https://kit.fontawesome.com/42d5adcbca.js" crossorigin="anonymous"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --dark-blue: #0B2C3D;
            --vert-sapin: #1B5E4B;
            --white: #FFFFFF;
            --light-gray: #F5F7FA;
            --border-color: #E4E7EB;
            --text-dark: #2C3E50;
            --text-light: #8892A0;
            --shadow: 0 2px 14px rgba(11, 44, 61, 0.1);
            --shadow-lg: 0 8px 24px rgba(11, 44, 61, 0.15);
        }
        
        body {
            font-family: 'Open Sans', sans-serif;
            background: linear-gradient(135deg, #0B2C3D 0%, #1B5E4B 100%);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
        }
        
        .sidebar {
            width: 260px;
            background: var(--white);
            padding: 30px 0;
            box-shadow: var(--shadow-lg);
            position: fixed;
            height: 100vh;
            overflow-y: auto;
        }
        
        .sidebar-header {
            padding: 0 20px 20px;
            border-bottom: 1px solid var(--border-color);
            text-align: center;
            margin-bottom: 20px;
        }
        
        .sidebar-logo {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #0B2C3D, #1B5E4B);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--white);
            font-size: 24px;
            margin: 0 auto 10px;
        }
        
        .sidebar-logo-text {
            font-size: 18px;
            font-weight: 700;
            color: var(--dark-blue);
        }
        
        .sidebar-nav {
            list-style: none;
        }
        
        .sidebar-nav a {
            display: flex;
            align-items: center;
            padding: 12px 20px;
            color: var(--text-light);
            text-decoration: none;
            transition: all 0.3s ease;
            font-size: 14px;
            font-weight: 500;
        }
        
        .sidebar-nav a:hover,
        .sidebar-nav a.active {
            background: linear-gradient(90deg, #f0f7ff, transparent);
            color: var(--vert-sapin);
            border-left: 4px solid var(--vert-sapin);
            padding-left: 16px;
        }
        
        .sidebar-nav i {
            width: 20px;
            margin-right: 12px;
            text-align: center;
        }
        
        .main-content {
            flex: 1;
            margin-left: 260px;
            padding: 40px;
            overflow-y: auto;
        }
        
        .page-header {
            display: flex;
            align-items: center;
            margin-bottom: 40px;
            background: var(--white);
            padding: 25px 30px;
            border-radius: 15px;
            box-shadow: var(--shadow);
            gap: 15px;
        }
        
        .back-btn {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--white);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--dark-blue);
            text-decoration: none;
            transition: all 0.3s ease;
        }
        
        .back-btn:hover {
            background: var(--light-gray);
            border-color: var(--vert-sapin);
            color: var(--vert-sapin);
        }
        
        .page-title {
            font-size: 28px;
            font-weight: 700;
            color: var(--dark-blue);
        }
        
        .form-container {
            background: var(--white);
            border-radius: 15px;
            padding: 40px;
            box-shadow: var(--shadow);
            max-width: 700px;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            margin-bottom: 25px;
        }
        
        .form-row.full {
            grid-template-columns: 1fr;
        }
        
        .form-group {
            display: flex;
            flex-direction: column;
        }
        
        .form-group label {
            margin-bottom: 10px;
            font-weight: 600;
            color: var(--dark-blue);
            font-size: 14px;
        }
        
        .form-group input,
        .form-group textarea,
        .form-group select {
            padding: 12px 15px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            font-family: 'Open Sans', sans-serif;
            transition: all 0.3s ease;
        }
        
        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--vert-sapin);
            box-shadow: 0 0 0 3px rgba(27, 94, 75, 0.1);
        }
        
        .form-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 35px;
        }
        
        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #0B2C3D, #1B5E4B);
            color: var(--white);
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(27, 94, 75, 0.4);
        }
        
        .btn-secondary {
            background: var(--light-gray);
            color: var(--text-dark);
            border: 1px solid var(--border-color);
        }
        
        .btn-secondary:hover {
            background: var(--white);
            border-color: var(--vert-sapin);
        }
        
        .btn-danger {
            background: #FF6B6B;
            color: var(--white);
        }
        
        .btn-danger:hover {
            background: #EE5A52;
        }
        
        .success-message {
            display: none;
            padding: 16px;
            background: #D4EDDA;
            border: 1px solid #C3E6CB;
            border-radius: 8px;
            color: #155724;
            margin-bottom: 25px;
            animation: slideDown 0.3s ease;
        }
        
        .success-message.show {
            display: block;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        
        .modal.show {
            display: flex;
        }
        
        .modal-content {
            background: var(--white);
            border-radius: 15px;
            padding: 30px;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }
        
        .modal-header {
            font-size: 20px;
            font-weight: 700;
            color: var(--dark-blue);
            margin-bottom: 20px;
        }
        
        .modal-body {
            color: var(--text-dark);
            margin-bottom: 25px;
            line-height: 1.6;
        }
        
        .modal-footer {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }
        
        .btn-cancel {
            background: var(--light-gray);
            color: var(--text-dark);
            border: 1px solid var(--border-color);
        }
        
        .btn-cancel:hover {
            background: #EEEEEE;
        }
        
        @keyframes slideDown {
            from {
                transform: translateY(-20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        
        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
            }
            
            .main-content {
                margin-left: 0;
                padding: 20px;
            }
            
            .form-row {
                grid-template-columns: 1fr;
                gap: 15px;
            }
            
            .form-container {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo">
                <i class="fas fa-chart-line"></i>
            </div>
            <div class="sidebar-logo-text">Fitopia</div>
        </div>
        <ul class="sidebar-nav">
            <li><a href="/dashboard.html"><i class="fas fa-th-large"></i> Dashboard</a></li>
            <li><a href="/products.html"><i class="fas fa-list"></i> Products</a></li>
            <li><a href="/users.html" class="active"><i class="fas fa-users"></i> Users</a></li>
            <li><a href="/settings.html"><i class="fas fa-cog"></i> Settings</a></li>
        </ul>
    </aside>

    <!-- Main Content -->
    <div class="main-content">
        <div class="page-header">
            <a href="/users.html" class="back-btn">
                <i class="fas fa-arrow-left"></i>
            </a>
            <h1 class="page-title">Edit User</h1>
        </div>

        <div class="form-container">
            <div class="success-message" id="successMessage">
                <i class="fas fa-check-circle"></i> User updated successfully!
            </div>

            <form id="userForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="firstName">First Name *</label>
                        <input type="text" id="firstName" name="firstName" placeholder="Enter first name" required>
                    </div>
                    <div class="form-group">
                        <label for="lastName">Last Name *</label>
                        <input type="text" id="lastName" name="lastName" placeholder="Enter last name" required>
                    </div>
                </div>

                <div class="form-row full">
                    <div class="form-group">
                        <label for="email">Email Address *</label>
                        <input type="email" id="email" name="email" placeholder="user@fitopia.com" required>
                    </div>
                </div>

                <div class="form-row full">
                    <div class="form-group">
                        <label for="password">New Password (leave empty to keep current)</label>
                        <input type="password" id="password" name="password" placeholder="Enter new password">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="role">Role *</label>
                        <select id="role" name="role" required>
                            <option value="">Select a role</option>
                            <option value="admin">Admin</option>
                            <option value="manager">Manager</option>
                            <option value="editor">Editor</option>
                            <option value="viewer">Viewer</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="status">Status *</label>
                        <select id="status" name="status" required>
                            <option value="active">Active</option>
                            <option value="inactive">Inactive</option>
                        </select>
                    </div>
                </div>

                <div class="form-row full">
                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" name="phone" placeholder="+1 (555) 000-0000">
                    </div>
                </div>

                <div class="form-actions">
                    <a href="/users.html" class="btn btn-secondary">
                        <i class="fas fa-times"></i> Cancel
                    </a>
                    <button type="button" onclick="openDeleteModal()" class="btn btn-danger">
                        <i class="fas fa-trash"></i> Delete
                    </button>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i> Save Changes
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div class="modal" id="deleteModal">
        <div class="modal-content">
            <div class="modal-header">
                <i class="fas fa-exclamation-circle" style="color: #FF6B6B; margin-right: 10px;"></i>Delete User
            </div>
            <div class="modal-body">
                Are you sure you want to delete this user? This action cannot be undone.
            </div>
            <div class="modal-footer">
                <button onclick="closeDeleteModal()" class="btn btn-cancel">Cancel</button>
                <button onclick="confirmDelete()" class="btn btn-danger">Delete</button>
            </div>
        </div>
    </div>

    <script>
        // Sample user data (in a real app, this would come from a database)
        const userData = {
            1: { firstName: 'John', lastName: 'Doe', email: 'john.doe@fitopia.com', role: 'admin', status: 'active', phone: '+1 (555) 123-4567' },
            2: { firstName: 'Sarah', lastName: 'Miller', email: 'sarah.miller@fitopia.com', role: 'manager', status: 'active', phone: '+1 (555) 234-5678' },
            3: { firstName: 'Michael', lastName: 'Chen', email: 'michael.chen@fitopia.com', role: 'editor', status: 'active', phone: '+1 (555) 345-6789' },
            4: { firstName: 'Emily', lastName: 'Johnson', email: 'emily.johnson@fitopia.com', role: 'viewer', status: 'inactive', phone: '+1 (555) 456-7890' },
            5: { firstName: 'David', lastName: 'Smith', email: 'david.smith@fitopia.com', role: 'editor', status: 'active', phone: '+1 (555) 567-8901' }
        };

        // Get user ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('id');

        // Navigation active state
        document.querySelectorAll('.sidebar-nav a').forEach(link => {
            if (link.href.includes('users.html')) {
                link.classList.add('active');
            }
        });

        // Load user data
        if (userId && userData[userId]) {
            const user = userData[userId];
            document.getElementById('firstName').value = user.firstName;
            document.getElementById('lastName').value = user.lastName;
            document.getElementById('email').value = user.email;
            document.getElementById('role').value = user.role;
            document.getElementById('status').value = user.status;
            document.getElementById('phone').value = user.phone;
        }

        // Form submission
        document.getElementById('userForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const successMessage = document.getElementById('successMessage');
            successMessage.classList.add('show');

            setTimeout(() => {
                window.location.href = '/users.html';
            }, 2000);
        });

        function openDeleteModal() {
            document.getElementById('deleteModal').classList.add('show');
        }

        function closeDeleteModal() {
            document.getElementById('deleteModal').classList.remove('show');
        }

        function confirmDelete() {
            window.location.href = '/users.html';
        }

        // Close modal on outside click
        document.getElementById('deleteModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeDeleteModal();
            }
        });
    </script>
</body>
</html>
